services:
  singbox-panel:
    build: .
    container_name: singbox-panel
    restart: unless-stopped
    ports:
      - "8080:8080"
      # 入站端口范围：按需放行你实际使用的端口，例如：
      # - "8388:8388"
      # - "8388:8388/udp"
    volumes:
      - ./data:/app/data
      # 外部接管模式：把宿主机的 sing-box 配置目录挂进容器（只读面板写配置用 :rw）
      # 注意：容器内无 systemd，启动/停止/重启按钮不可用，请在宿主机执行 systemctl；
      # 推荐裸机部署（见 singbox-panel.service），Docker 仅用于编辑配置+看监控。
      # - /etc/sing-box:/etc/sing-box:rw
    environment:
      - DATA_DIR=/app/data

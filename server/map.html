<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌍 全球攻击地图 - 天龙面板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05080d;color:#e6edf3;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid #1c2733}
header h1{font-size:18px}
header a{color:#58a6ff;font-size:13px;text-decoration:none}
.stats{display:flex;gap:22px;margin-left:auto;font-size:13px;color:#8b949e}
.stats b{color:#f85149;font-size:17px;display:block}
main{display:flex;gap:0;height:calc(100vh - 57px)}
#mapwrap{flex:1;position:relative;overflow:hidden}
#mapwrap svg{width:100%;height:100%}
#legend{position:absolute;left:16px;bottom:14px;background:rgba(13,17,23,.85);border:1px solid #30363d;border-radius:8px;padding:10px 12px;font-size:12px;color:#8b949e}
#legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
aside{width:320px;border-left:1px solid #1c2733;overflow-y:auto;padding:14px;background:#0a0e14}
aside h2{font-size:14px;margin-bottom:10px;color:#8b949e}
.atk{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid #161b22;font-size:13px}
.atk .rank{width:24px;height:24px;border-radius:50%;background:#21262d;color:#8b949e;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
.atk .rank.top{background:#3d1d1d;color:#f85149}
.atk .ip{font-family:monospace}
.atk .geo{color:#8b949e;font-size:11px}
.atk .n{margin-left:auto;color:#f85149;font-weight:bold;flex:none}
.pulse{transform-origin:center;transform-box:fill-box;animation:pl 2s ease-out infinite}
@keyframes pl{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.6)}}
.tip{position:absolute;pointer-events:none;background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 10px;font-size:12px;display:none;z-index:10;max-width:240px}
</style>
</head>
<body>
<header>
  <h1>🌍 全球攻击地图</h1>
  <a href="/">← 返回看板</a>
  <div class="stats">
    <div><b id="st-ips">-</b>攻击 IP</div>
    <div><b id="st-atk">-</b>24h 尝试</div>
    <div><b id="st-c">-</b>来源国家</div>
  </div>
</header>
<main>
  <div id="mapwrap">
    <div id="svghost"></div>
    <div class="tip" id="tip"></div>
    <div id="legend"><i style="background:#f85149"></i>SSH 扫描 / 爆破来源（圆圈越大尝试越多）<br><span style="color:#5b6570">数据：各服务器 22 端口登录日志 · 每 30 秒刷新</span></div>
  </div>
  <aside>
    <h2>🏆 攻击 IP 排行（24h）</h2>
    <div id="rank"></div>
  </aside>
</main>
<script>
const W=1200,H=600;
const X=lon=>(lon+180)/360*W, Y=lat=>(90-lat)/180*H;
let svgEl=null;
fetch('world.svg').then(r=>r.text()).then(t=>{
  document.getElementById('svghost').innerHTML=t;
  svgEl=document.querySelector('#worldmap');
  load();
});
async function load(){
  const r=await fetch('/api/attacks?hours=24&limit=200').then(r=>r.json());
  const at=r.attacks.filter(a=>a.lat!=null&&a.lon!=null);
  document.getElementById('st-ips').textContent=r.attacks.length;
  document.getElementById('st-atk').textContent=r.attacks.reduce((s,a)=>s+a.attempts,0).toLocaleString();
  document.getElementById('st-c').textContent=new Set(at.map(a=>a.country).filter(Boolean)).size;
  // markers
  if(svgEl){
    svgEl.querySelectorAll('.mk').forEach(e=>e.remove());
    const maxA=Math.max(...at.map(a=>a.attempts),1);
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','mk');
    at.slice(0,120).forEach(a=>{
      const rr=4+11*Math.log10(a.attempts+1)/Math.log10(maxA+1);
      const cx=X(a.lon), cy=Y(a.lat);
      const halo=document.createElementNS('http://www.w3.org/2000/svg','circle');
      halo.setAttribute('cx',cx);halo.setAttribute('cy',cy);halo.setAttribute('r',rr);
      halo.setAttribute('fill','none');halo.setAttribute('stroke','#f85149');
      halo.setAttribute('stroke-width','1.5');halo.setAttribute('class','pulse');
      const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('cx',cx);dot.setAttribute('cy',cy);dot.setAttribute('r',rr*0.55);
      dot.setAttribute('fill','#f85149');dot.setAttribute('fill-opacity','.85');
      dot.style.cursor='pointer';
      dot.addEventListener('mouseenter',ev=>showTip(ev,a));
      dot.addEventListener('mouseleave',()=>document.getElementById('tip').style.display='none');
      g.appendChild(halo);g.appendChild(dot);
    });
    svgEl.appendChild(g);
  }
  // rank list
  document.getElementById('rank').innerHTML=r.attacks.slice(0,50).map((a,i)=>
    `<div class="atk"><span class="rank${i<3?' top':''}">${i+1}</span>
     <span><span class="ip">${a.ip}</span><br><span class="geo">${a.country||'未知'} ${a.city||''} · ${a.servers.join(',')}</span></span>
     <span class="n">${a.attempts}</span></div>`).join('')
    || '<div style="color:#8b949e;font-size:13px">暂无攻击数据 🎉</div>';
}
function showTip(ev,a){
  const tip=document.getElementById('tip');
  tip.innerHTML=`<b style="font-family:monospace">${a.ip}</b><br>${a.country||'未知'} ${a.city||''}<br>尝试 <b style="color:#f85149">${a.attempts}</b> 次<br><span style="color:#8b949e">${a.servers.join(', ')}</span>`;
  const wrap=document.getElementById('mapwrap').getBoundingClientRect();
  tip.style.display='block';
  tip.style.left=(ev.clientX-wrap.left+14)+'px';
  tip.style.top=(ev.clientY-wrap.top+10)+'px';
}
setInterval(load,30000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天龙面板 🐉</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--txt:#e6edf3;--mut:#8b949e;
--grn:#3fb950;--yel:#d29922;--red:#f85149;--acc:#58a6ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px;max-width:1200px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer}
.card.sel{border-color:var(--acc)}
.card h3{font-size:16px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--grn)}
.dot.off{background:var(--red)}
.meta{color:var(--mut);font-size:12px;margin:6px 0 10px}
.bar-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.bar-row label{width:52px;color:var(--mut)}
.bar{flex:1;height:8px;background:#21262d;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grn);border-radius:4px;transition:width .5s}
.bar i.warn{background:var(--yel)}.bar i.crit{background:var(--red)}
.bar-row span{width:64px;text-align:right;font-variant-numeric:tabular-nums}
canvas.chart{width:100%;height:150px;margin-top:8px;background:#0d1117;border-radius:6px}
.sec{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:14px}
.sec h2{font-size:15px;margin-bottom:10px}
.alert{padding:8px 10px;border-left:3px solid var(--yel);background:#21262d;border-radius:0 6px 6px 0;margin:6px 0;font-size:13px}
.alert.critical{border-color:var(--red)}
.alert small{color:var(--mut);display:block;margin-top:2px}
.ok-line{color:var(--grn);font-size:13px}
.chk{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border)}
.chk:last-child{border:none}
.badge{padding:2px 8px;border-radius:10px;font-size:12px}
.badge.ok{background:#1a3a24;color:var(--grn)}.badge.bad{background:#3d1d1d;color:var(--red)}
#ask-box{display:flex;gap:8px;margin-top:8px}
#ask-box input{flex:1;background:#0d1117;border:1px solid var(--border);color:var(--txt);border-radius:6px;padding:8px 10px;font-size:14px}
#ask-box button{background:#1f6feb;border:none;color:#fff;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:14px}
#ask-ans{white-space:pre-wrap;font-size:13px;background:#0d1117;border-radius:6px;padding:10px;margin-top:8px;max-height:260px;overflow:auto}
#detail{display:none}
#detail h2{font-size:15px;margin-bottom:6px}
.procs{font-size:12px;color:var(--mut);margin-top:8px}
.procs div{display:flex;justify-content:space-between;padding:2px 0}
</style>
</head>
<body>
<h1>🐉 天龙面板</h1>
<div class="sub">比哪吒更强的服务器监控 · <span id="clock"></span></div>

<div class="grid" id="servers"></div>

<div class="sec" id="detail">
  <h2 id="detail-title">服务器详情</h2>
  <div class="bar-row"><label>CPU</label><div class="bar"><i id="d-cpu"></i></div><span id="d-cpu-t"></span></div>
  <div class="bar-row"><label>内存</label><div class="bar"><i id="d-mem"></i></div><span id="d-mem-t"></span></div>
  <div class="bar-row"><label>磁盘</label><div class="bar"><i id="d-disk"></i></div><span id="d-disk-t"></span></div>
  <canvas class="chart" id="ch-cpu" width="600" height="150"></canvas>
  <canvas class="chart" id="ch-mem" width="600" height="150"></canvas>
  <div class="procs" id="d-procs"></div>
</div>

<div class="sec">
  <h2>⚠️ 告警</h2>
  <div id="alerts"><div class="ok-line">加载中…</div></div>
</div>

<div class="sec">
  <h2>🌐 应用监控</h2>
  <div id="checks"><div class="ok-line">加载中…</div></div>
</div>

<div class="sec">
  <h2>🤖 AI 运维助手</h2>
  <div style="color:var(--mut);font-size:12px">试试问：「哪台机器最卡？」「磁盘还能撑多久？」「现在有什么告警？」</div>
  <div id="ask-box">
    <input id="ask-q" placeholder="问点什么…" onkeydown="if(event.key==='Enter')ask()">
    <button onclick="ask()">问</button>
  </div>
  <div id="ask-ans" style="display:none"></div>
</div>

<script>
let selServer=null, cache={};
const $=id=>document.getElementById(id);
function barCls(v){return v>90?'crit':v>75?'warn':''}
function setBar(id,v,txt){const e=$(id);e.style.width=Math.min(100,v)+'%';e.className=barCls(v);$(id+'-t').textContent=txt}

async function load(){
  const r=await fetch('/api/servers').then(r=>r.json());
  const box=$('servers'); box.innerHTML='';
  r.servers.forEach(s=>{
    const m=s.metrics, d=document.createElement('div');
    d.className='card'+(selServer===s.name?' sel':'');
    const dot=m?`<span class="dot${s.online?'':' off'}"></span>`:'<span class="dot off"></span>';
    let inner=`<h3>${dot}${s.name}</h3><div class="meta">${s.platform||''} ${s.online?'· 在线':'· <b style="color:var(--red)">离线</b>'}</div>`;
    if(m){
      inner+=['cpu','mem_pct','disk_pct'].map(k=>{
        const lbl={cpu:'CPU',mem_pct:'内存',disk_pct:'磁盘'}[k], v=m[k]||0;
        return `<div class="bar-row"><label>${lbl}</label><div class="bar"><i class="${barCls(v)}" style="width:${v}%"></i></div><span>${v}%</span></div>`;
      }).join('');
    } else inner+='<div class="meta">暂无数据</div>';
    d.innerHTML=inner;
    d.onclick=()=>{selServer=s.name;$('detail').style.display='block';loadDetail()};
    box.appendChild(d);
  });
  if(!r.servers.length) box.innerHTML='<div class="meta">还没有 agent 上报。去看 README 把 agent 装到服务器上。</div>';
  loadAlerts(); loadChecks();
}
async function loadAlerts(){
  const r=await fetch('/api/alerts').then(r=>r.json());
  const act=r.alerts.filter(a=>!a.resolved);
  $('alerts').innerHTML=act.length?act.map(a=>
    `<div class="alert ${a.level}">${a.message}<small>${new Date(a.ts*1000).toLocaleString()} · ${a.server}</small></div>`
  ).join(''):'<div class="ok-line">✅ 目前没有未处理的告警</div>';
}
async function loadChecks(){
  const r=await fetch('/api/checks').then(r=>r.json());
  $('checks').innerHTML=r.checks.length?r.checks.map(c=>
    `<div class="chk"><span>${c.name} <small style="color:var(--mut)">${c.target}</small>${c.ssl_days!=null?` <small style="color:var(--mut)">证书${c.ssl_days.toFixed(0)}天</small>`:''}</span>
     <span class="badge ${c.last_ok?'ok':'bad'}">${c.last_ok?'正常':'异常'} ${c.last_latency_ms!=null?c.last_latency_ms+'ms':''}</span></div>`
  ).join(''):'<div class="meta">未配置应用监控，可在 server.json 的 checks 里添加</div>';
}
function draw(id,pts,color,label){
  const c=$(id),x=c.getContext('2d'),W=c.width,H=c.height;
  x.clearRect(0,0,W,H);x.fillStyle='#8b949e';x.font='11px sans-serif';x.fillText(label,8,14);
  if(pts.length<2)return;
  const max=Math.max(...pts.map(p=>p[1]),1);
  x.strokeStyle=color;x.lineWidth=1.5;x.beginPath();
  pts.forEach((p,i)=>{const px=i/(pts.length-1)*W, py=H-8-(p[1]/max)*(H-24); i?x.lineTo(px,py):x.moveTo(px,py)});
  x.stroke();
}
async function loadDetail(){
  if(!selServer)return;
  const r=await fetch('/api/servers').then(r=>r.json());
  const s=r.servers.find(x=>x.name===selServer); if(!s||!s.metrics)return;
  const m=s.metrics;
  $('detail-title').textContent='📊 '+s.name+' 详情';
  setBar('d-cpu',m.cpu,m.cpu+'%'); setBar('d-mem',m.mem_pct,m.mem_pct+'%'); setBar('d-disk',m.disk_pct,m.disk_pct+'%');
  const h=await fetch('/api/metrics/'+encodeURIComponent(selServer)+'?hours=24').then(r=>r.json());
  draw('ch-cpu',h.points.map(p=>[p.ts,p.cpu]),'#58a6ff','CPU %（24h）');
  draw('ch-mem',h.points.map(p=>[p.ts,p.mem_pct]),'#3fb950','内存 %（24h）');
  const ps=m.top_procs||[];
  $('d-procs').innerHTML='<b>最占资源的进程</b>'+ps.map(p=>
    `<div><span>${p.name} (pid ${p.pid})</span><span>CPU ${p.cpu}% · MEM ${p.mem}%</span></div>`).join('');
}
async function ask(){
  const q=$('ask-q').value.trim(); if(!q)return;
  const ans=$('ask-ans'); ans.style.display='block'; ans.textContent='思考中…';
  try{
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q})}).then(r=>r.json());
    ans.textContent=r.answer||JSON.stringify(r);
  }catch(e){ans.textContent='请求失败: '+e}
}
setInterval(()=>{$('clock').textContent=new Date().toLocaleString()},1000);
load(); setInterval(load,5000); setInterval(loadDetail,15000);
</script>
</body>
</html>
